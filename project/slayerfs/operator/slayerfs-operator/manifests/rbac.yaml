apiVersion: v1
kind: ServiceAccount
metadata:
  name: slayerfs-operator
  namespace: slayerfs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slayerfs-operator
rules:
  - apiGroups: ["storage.slayerfs.io"]
    resources: ["slayerfsclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.slayerfs.io"]
    resources: ["slayerfsclusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["storage.slayerfs.io"]
    resources: ["slayerfsmounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.slayerfs.io"]
    resources: ["slayerfsmounts/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slayerfs-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slayerfs-operator
subjects:
  - kind: ServiceAccount
    name: slayerfs-operator
    namespace: slayerfs-system
