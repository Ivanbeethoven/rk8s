apiVersion: apps/v1
kind: Deployment
metadata:
  name: slayerfs-operator
  namespace: slayerfs-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slayerfs-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slayerfs-operator
    spec:
      serviceAccountName: slayerfs-operator
      containers:
        - name: operator
          image: __SLAYERFS_OPERATOR_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - run
          env:
            - name: RUST_LOG
              value: info
